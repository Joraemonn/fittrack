<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitTrack AI — Scan Test</title>
<style>
  :root {
    --bg: #0a0e1a;
    --bg-card: #131826;
    --bg-card-hover: #1a2033;
    --border: #232a3d;
    --text: #e8ecf3;
    --text-dim: #8b94a8;
    --text-mute: #5b6478;
    --accent: #ff5252;
    --accent-hover: #ff6a6a;
    --accent-dim: rgba(255, 82, 82, 0.15);
    --success: #36e09c;
    --success-dim: rgba(54, 224, 156, 0.12);
    --warning: #f5b454;
    --sg: #ee2a35;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px;
    background-image:
      radial-gradient(ellipse at top left, rgba(255, 82, 82, 0.08), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(54, 224, 156, 0.05), transparent 50%);
  }

  .container { max-width: 720px; margin: 0 auto; }

  /* Header */
  .header { margin-bottom: 28px; }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    background: var(--accent-dim);
    color: var(--accent);
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.5px; }
  .subtitle { color: var(--text-dim); font-size: 14px; }

  /* API status pill */
  .api-status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 12px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-mute);
    transition: background 0.3s;
  }
  .api-status.online .status-dot {
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
  }
  .api-status.offline .status-dot { background: var(--accent); }

  /* Card */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
  }

  /* Mode toggle */
  .mode-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    background: var(--bg);
    padding: 4px;
    border-radius: 10px;
    margin-bottom: 20px;
  }
  .mode-toggle button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 10px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
    font-family: inherit;
  }
  .mode-toggle button.active {
    background: var(--bg-card-hover);
    color: var(--text);
  }
  .mode-toggle button:hover:not(.active) { color: var(--text); }

  /* Upload zone */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .upload-zone:hover {
    border-color: var(--accent);
    background: var(--accent-dim);
  }
  .upload-zone.dragover {
    border-color: var(--accent);
    background: var(--accent-dim);
  }
  .upload-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.6; }
  .upload-text { color: var(--text); font-weight: 500; margin-bottom: 4px; }
  .upload-hint { color: var(--text-mute); font-size: 13px; }
  #fileInput { display: none; }

  /* Camera */
  .camera-wrapper {
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 4 / 3;
    margin-bottom: 12px;
  }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .camera-placeholder {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%;
    color: var(--text-mute);
    font-size: 14px;
  }
  .camera-placeholder .icon { font-size: 48px; margin-bottom: 8px; opacity: 0.4; }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
    width: 100%;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled {
    background: var(--border);
    color: var(--text-mute);
    cursor: not-allowed;
  }
  .btn-secondary {
    background: var(--bg-card-hover);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); }

  /* Preview */
  .preview-wrapper {
    border-radius: 12px;
    overflow: hidden;
    background: var(--bg);
    margin-bottom: 12px;
    max-height: 400px;
    display: flex;
    justify-content: center;
  }
  #preview { max-width: 100%; max-height: 400px; display: block; }

  /* Results */
  #resultsCard { display: none; }
  #resultsCard.visible { display: block; animation: slideUp 0.3s ease-out; }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .food-name {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sg-flag {
    font-size: 18px;
  }
  .confidence-badge {
    padding: 6px 12px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
    background: var(--success-dim);
    color: var(--success);
    white-space: nowrap;
  }
  .confidence-badge.low { background: rgba(245, 180, 84, 0.15); color: var(--warning); }
  .confidence-badge.verylow { background: var(--accent-dim); color: var(--accent); }

  .description {
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 20px;
  }

  /* Nutrition grid */
  .nutrition-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .macro {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 8px;
    text-align: center;
  }
  .macro-label {
    font-size: 10px;
    color: var(--text-mute);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .macro-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .macro-unit {
    font-size: 11px;
    color: var(--text-mute);
    font-weight: 500;
    margin-top: 2px;
  }
  .macro.calories .macro-value { color: var(--accent); }

  .per-label {
    text-align: center;
    color: var(--text-mute);
    font-size: 12px;
    margin-bottom: 16px;
  }
  .source {
    font-size: 11px;
    color: var(--text-mute);
    text-align: center;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  /* Top 5 alternatives */
  .alternatives-toggle {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    margin-top: 12px;
    width: 100%;
    font-family: inherit;
    transition: all 0.2s;
  }
  .alternatives-toggle:hover { color: var(--text); border-color: var(--accent); }
  .alternatives-list {
    display: none;
    margin-top: 8px;
    padding: 12px;
    background: var(--bg);
    border-radius: 8px;
  }
  .alternatives-list.visible { display: block; }
  .alt-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 13px;
  }
  .alt-name { color: var(--text-dim); }
  .alt-confidence { color: var(--text-mute); font-variant-numeric: tabular-nums; }

  /* Loading state */
  .loading {
    display: none;
    text-align: center;
    padding: 20px;
    color: var(--text-dim);
    font-size: 14px;
  }
  .loading.visible { display: block; }
  .spinner {
    display: inline-block;
    width: 28px; height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error */
  .error {
    display: none;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    margin-top: 12px;
  }
  .error.visible { display: block; }

  /* Mode panels */
  .mode-panel { display: none; }
  .mode-panel.active { display: block; }

  /* Footer */
  .footer {
    text-align: center;
    color: var(--text-mute);
    font-size: 12px;
    margin-top: 24px;
  }
  .footer code {
    background: var(--bg-card);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    color: var(--text-dim);
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="badge">Developer Tool</span>
    <h1>FitTrack AI — Scan Test</h1>
    <p class="subtitle">Verify the food classification API before integrating into the main site.</p>
    <div class="api-status" id="apiStatus">
      <span class="status-dot"></span>
      <span id="apiStatusText">Checking API…</span>
    </div>
  </div>

  <!-- Capture card -->
  <div class="card">
    <div class="mode-toggle">
      <button class="active" data-mode="upload" type="button">📁 Upload Image</button>
      <button data-mode="camera" type="button">📷 Use Camera</button>
    </div>

    <!-- Upload panel -->
    <div class="mode-panel active" id="uploadPanel">
      <label class="upload-zone" id="uploadZone">
        <div class="upload-icon">🖼️</div>
        <div class="upload-text">Click to choose an image</div>
        <div class="upload-hint">or drag and drop here · JPG, PNG, WebP</div>
        <input type="file" id="fileInput" accept="image/*">
      </label>
    </div>

    <!-- Camera panel -->
    <div class="mode-panel" id="cameraPanel">
      <div class="camera-wrapper">
        <video id="video" autoplay playsinline muted></video>
        <div class="camera-placeholder" id="cameraPlaceholder">
          <div class="icon">📷</div>
          <div>Click "Start Camera" to begin</div>
        </div>
      </div>
      <button class="btn btn-secondary" id="startCameraBtn" style="width:100%; margin-bottom: 8px;" type="button">Start Camera</button>
      <button class="btn btn-primary" id="captureBtn" type="button" disabled>📸 Capture & Analyze</button>
    </div>

    <!-- Preview (shown after upload/capture, hidden initially) -->
    <div id="previewSection" style="display: none; margin-top: 20px;">
      <div class="preview-wrapper">
        <img id="preview" alt="Selected meal">
      </div>
      <button class="btn btn-primary" id="analyzeBtn" type="button">🔍 Analyze Meal</button>
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>Analyzing your meal…</div>
    </div>

    <!-- Error -->
    <div class="error" id="error"></div>
  </div>

  <!-- Results card -->
  <div class="card" id="resultsCard">
    <div class="result-header">
      <div class="food-name" id="foodName"></div>
      <div class="confidence-badge" id="confidenceBadge"></div>
    </div>
    <p class="description" id="description"></p>

    <div class="nutrition-grid">
      <div class="macro calories">
        <div class="macro-label">Calories</div>
        <div class="macro-value" id="calories">—</div>
        <div class="macro-unit">kcal</div>
      </div>
      <div class="macro">
        <div class="macro-label">Protein</div>
        <div class="macro-value" id="protein">—</div>
        <div class="macro-unit">g</div>
      </div>
      <div class="macro">
        <div class="macro-label">Carbs</div>
        <div class="macro-value" id="carbs">—</div>
        <div class="macro-unit">g</div>
      </div>
      <div class="macro">
        <div class="macro-label">Fats</div>
        <div class="macro-value" id="fats">—</div>
        <div class="macro-unit">g</div>
      </div>
    </div>
    <p class="per-label">per <span id="perLabel">100g</span></p>

    <button class="alternatives-toggle" id="altToggle" type="button">
      Not quite right? Show top 5 alternatives
    </button>
    <div class="alternatives-list" id="altList"></div>

    <p class="source" id="source"></p>
  </div>

  <div class="footer">
    API endpoint: <code id="apiUrl">http://localhost:8000/predict</code>
  </div>
</div>

<script>
const API_BASE = 'http://localhost:8000';
const PREDICT_URL = `${API_BASE}/predict`;
const HEALTH_URL = `${API_BASE}/health`;

let currentBlob = null;
let cameraStream = null;

// ─── DOM refs ───
const $ = id => document.getElementById(id);

// ─── API health check on load ───
async function checkAPIStatus() {
  try {
    const res = await fetch(HEALTH_URL);
    if (res.ok) {
      $('apiStatus').classList.add('online');
      $('apiStatus').classList.remove('offline');
      $('apiStatusText').textContent = 'API online · localhost:8000';
    } else {
      throw new Error('API responded with error');
    }
  } catch (err) {
    $('apiStatus').classList.add('offline');
    $('apiStatusText').textContent = 'API offline · run "uvicorn api:app --reload" in fittrackCV';
  }
}
checkAPIStatus();

// ─── Mode toggle ───
document.querySelectorAll('.mode-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    const mode = btn.dataset.mode;
    document.querySelectorAll('.mode-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.mode-panel').forEach(p => p.classList.remove('active'));
    $(mode === 'upload' ? 'uploadPanel' : 'cameraPanel').classList.add('active');

    // Reset preview when switching modes
    hidePreview();
    if (mode !== 'camera' && cameraStream) stopCamera();
  });
});

// ─── Upload mode ───
$('fileInput').addEventListener('change', (e) => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

// Drag & drop
['dragenter', 'dragover'].forEach(evt => {
  $('uploadZone').addEventListener(evt, (e) => {
    e.preventDefault();
    $('uploadZone').classList.add('dragover');
  });
});
['dragleave', 'drop'].forEach(evt => {
  $('uploadZone').addEventListener(evt, (e) => {
    e.preventDefault();
    $('uploadZone').classList.remove('dragover');
  });
});
$('uploadZone').addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) handleFile(file);
  else showError('Please drop an image file.');
});

function handleFile(file) {
  if (!file.type.startsWith('image/')) {
    showError('That doesn\'t look like an image. Try a JPG or PNG.');
    return;
  }
  currentBlob = file;
  showPreview(URL.createObjectURL(file));
}

// ─── Camera mode ───
$('startCameraBtn').addEventListener('click', async () => {
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    $('video').srcObject = cameraStream;
    $('cameraPlaceholder').style.display = 'none';
    $('startCameraBtn').textContent = '🔌 Stop Camera';
    $('captureBtn').disabled = false;
    $('startCameraBtn').onclick = () => {
      stopCamera();
      $('startCameraBtn').textContent = 'Start Camera';
      $('captureBtn').disabled = true;
      $('cameraPlaceholder').style.display = 'flex';
      $('startCameraBtn').onclick = arguments.callee;  // re-bind
      location.reload();  // simplest reset
    };
  } catch (err) {
    showError('Could not access camera: ' + err.message);
  }
});

$('captureBtn').addEventListener('click', () => {
  const video = $('video');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);

  canvas.toBlob(async (blob) => {
    currentBlob = blob;
    showPreview(URL.createObjectURL(blob));
    // Auto-analyze after camera capture
    await analyzeMeal();
  }, 'image/jpeg', 0.9);
});

function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
}

// ─── Preview + analyze ───
function showPreview(url) {
  $('preview').src = url;
  $('previewSection').style.display = 'block';
  hideError();
  $('resultsCard').classList.remove('visible');
}

function hidePreview() {
  $('previewSection').style.display = 'none';
  currentBlob = null;
}

$('analyzeBtn').addEventListener('click', analyzeMeal);

async function analyzeMeal() {
  if (!currentBlob) {
    showError('No image selected.');
    return;
  }

  hideError();
  $('loading').classList.add('visible');
  $('resultsCard').classList.remove('visible');
  $('analyzeBtn').disabled = true;

  try {
    const formData = new FormData();
    formData.append('file', currentBlob, 'meal.jpg');

    const res = await fetch(PREDICT_URL, {
      method: 'POST',
      body: formData
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({ detail: 'Unknown error' }));
      throw new Error(errData.detail || `HTTP ${res.status}`);
    }

    const data = await res.json();
    displayResults(data);
  } catch (err) {
    showError('Could not analyze: ' + err.message);
  } finally {
    $('loading').classList.remove('visible');
    $('analyzeBtn').disabled = false;
  }
}

// ─── Display results ───
function displayResults(data) {
  const { prediction, nutrition, top_5_alternatives } = data;

  // Food name + flag
  $('foodName').innerHTML = prediction.food_display +
    (prediction.is_singapore_food ? ' <span class="sg-flag">🇸🇬</span>' : '');

  // Confidence badge
  const c = prediction.confidence;
  const badge = $('confidenceBadge');
  badge.textContent = `${c.toFixed(1)}% confidence`;
  badge.classList.remove('low', 'verylow');
  if (c < 50) badge.classList.add('verylow');
  else if (c < 80) badge.classList.add('low');

  // Nutrition
  if (nutrition) {
    $('description').textContent = nutrition.description || '';
    $('calories').textContent = nutrition.calories;
    $('protein').textContent = nutrition.protein;
    $('carbs').textContent = nutrition.carbs;
    $('fats').textContent = nutrition.fats;
    $('perLabel').textContent = nutrition.per || '100g';
    $('source').textContent = 'Nutrition source: ' + (nutrition.source || 'Unknown');
  } else {
    $('description').textContent = 'No nutrition data available for this food.';
    ['calories', 'protein', 'carbs', 'fats'].forEach(id => $(id).textContent = '—');
    $('source').textContent = '';
  }

  // Top 5 alternatives
  const altList = $('altList');
  altList.innerHTML = '';
  top_5_alternatives.forEach((alt, i) => {
    const div = document.createElement('div');
    div.className = 'alt-item';
    const flag = alt.is_singapore_food ? ' 🇸🇬' : '';
    const name = alt.food.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    div.innerHTML = `
      <span class="alt-name">${i + 1}. ${name}${flag}</span>
      <span class="alt-confidence">${alt.confidence.toFixed(2)}%</span>
    `;
    altList.appendChild(div);
  });
  altList.classList.remove('visible');
  $('altToggle').textContent = 'Not quite right? Show top 5 alternatives';

  $('resultsCard').classList.add('visible');
  $('resultsCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

$('altToggle').addEventListener('click', () => {
  const list = $('altList');
  list.classList.toggle('visible');
  $('altToggle').textContent = list.classList.contains('visible')
    ? 'Hide alternatives'
    : 'Not quite right? Show top 5 alternatives';
});

// ─── Error helpers ───
function showError(msg) {
  $('error').textContent = '⚠️ ' + msg;
  $('error').classList.add('visible');
}
function hideError() {
  $('error').classList.remove('visible');
}
</script>
</body>
</html>
